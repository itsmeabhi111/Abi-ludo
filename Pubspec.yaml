name: abi_ludo
description: Ludo King Style game with sound
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^5.2.1
  flutter_animate: ^4.5.0
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
